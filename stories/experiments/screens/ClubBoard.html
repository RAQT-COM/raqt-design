<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=Oswald:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #2f6b3c; }
    a:hover { color: #bf4230; }
  </style>
<style>html,body{margin:0;padding:0;}</style>
</head>
<body>
<div style="width: 402px; height: 874px; overflow: hidden; background: #e9e2d0; color: #24231d; font-family: 'Courier Prime', 'Courier New', monospace; display: flex; flex-direction: column;">

  <div style="flex: none; height: 54px;"></div>

  <div style="flex: none; display: flex; align-items: flex-end; justify-content: space-between; height: 54px; padding: 0 20px 8px; border-bottom: 2px solid #24231d;">
    <img src="logotype.png" alt="RAQT" style="height: 20px; width: auto; filter: invert(1);">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em;">1259 PTS</span>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 16px 18px 0; min-height: 0;">

    <div style="flex: none; display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;">Anslagstavlan</span>
      <span style="font-size: 11px; letter-spacing: 0.06em;">LÖR 12 OKT</span>
    </div>

    <div style="flex: none; background: #f7f3e8; border: 1.5px solid #24231d; box-shadow: 5px 5px 0 rgba(36,35,29,0.16); padding: 15px 16px 17px; transform: rotate(-0.5deg);">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
        <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 23px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase;">Idag 14:00</span>
        <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #bf4230; border: 1.5px solid #bf4230; padding: 2px 8px; transform: rotate(2deg);">2 av 4</span>
      </div>
      <div style="font-size: 12px; margin-top: 5px;">Freddes Pickleballsällskap · 5,3 km</div>

      <div style="position: relative; width: 318px; height: 140px; margin: 15px auto 0;">
        <svg width="318" height="140" viewBox="0 0 318 140" style="position: absolute; top: 0; left: 0;" aria-hidden="true">
          <g stroke="#24231d" fill="none" stroke-width="1.5">
            <rect x="8" y="8" width="302" height="124"></rect>
            <line x1="159" y1="8" x2="159" y2="132" stroke-width="2.5"></line>
            <line x1="130" y1="8" x2="130" y2="132"></line>
            <line x1="188" y1="8" x2="188" y2="132"></line>
            <line x1="8" y1="70" x2="130" y2="70"></line>
            <line x1="188" y1="70" x2="310" y2="70"></line>
          </g>
          <g stroke="#2f6b3c" stroke-width="1" opacity="0.5">
            <line x1="132" y1="10" x2="132" y2="130"></line>
            <line x1="140" y1="10" x2="140" y2="130"></line>
            <line x1="148" y1="10" x2="148" y2="130"></line>
            <line x1="170" y1="10" x2="170" y2="130"></line>
            <line x1="178" y1="10" x2="178" y2="130"></line>
            <line x1="186" y1="10" x2="186" y2="130"></line>
          </g>
        </svg>
        <div style="position: absolute; left: 69px; top: 39px; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: #2f6b3c; color: #f7f3e8; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">M</div>
        <div style="position: absolute; left: 249px; top: 39px; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; overflow: hidden; border: 1.5px solid #24231d;">
          <img src="niklas.png" alt="" style="width: 32px; height: 32px; display: block;">
        </div>
        <div style="position: absolute; left: 69px; top: 101px; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 1.5px dashed #8d8878;"></div>
        <div style="position: absolute; left: 249px; top: 101px; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 1.5px dashed #8d8878;"></div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 15px; padding-top: 13px; border-top: 1.5px dashed #c3bca8;">
        <span style="font-size: 12px;">Två platser kvar</span>
        <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase; background: #24231d; color: #f7f3e8; padding: 8px 16px;">Ta en plats</span>
      </div>
    </div>

    <div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
      <div style="background: #f7f3e8; border: 1.5px solid #24231d; box-shadow: 4px 4px 0 rgba(36,35,29,0.16); padding: 13px; transform: rotate(0.6deg); display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 10px; letter-spacing: 0.10em;">STÄNGER TORS</span>
        <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 16px; font-weight: 500; line-height: 1.1; text-transform: uppercase;">Göteborg Winter Slam</span>
        <span style="align-self: flex-start; font-size: 10px; font-weight: 700; letter-spacing: 0.10em; color: #bf4230; border: 1.5px solid #bf4230; padding: 2px 7px;">6 KVAR</span>
      </div>
      <div style="background: #2f6b3c; color: #f2efe2; box-shadow: 4px 4px 0 rgba(36,35,29,0.16); padding: 13px; transform: rotate(-0.4deg); display: flex; flex-direction: column; justify-content: space-between;">
        <span style="font-size: 10px; letter-spacing: 0.10em; opacity: 0.8;">TRÄNARE ONLINE</span>
        <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 34px; font-weight: 500; line-height: 1;">12</span>
        <span style="font-size: 11px;">Fråga vad du vill</span>
      </div>
    </div>

    <div style="flex: none; display: flex; align-items: center; gap: 12px; border-top: 1.5px solid #24231d; border-bottom: 1.5px solid #24231d; padding: 12px 2px;">
      <img src="niklas.png" alt="" style="flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #24231d;">
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <span style="font-size: 10px; letter-spacing: 0.10em;">NIKLAS SIDFALK</span>
        <span style="font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Kul att spela idag! Igen på lördag?</span>
      </div>
    </div>

  </div>

  <div style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 84px; align-items: stretch; padding: 0 18px 16px; border-top: 2px solid #24231d; font-family: 'Oswald', 'Arial Narrow', sans-serif;">
    <div style="display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; border-bottom: 3px solid #24231d;">Idag</div>
    <div style="display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 400; letter-spacing: 0.10em; text-transform: uppercase; color: #6f6a5c;">Sök</div>
    <div style="display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 400; letter-spacing: 0.10em; text-transform: uppercase; color: #6f6a5c;">Chatt</div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <img src="nav-me.png" alt="" style="width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #24231d;">
    </div>
  </div>

</div>
</body>
</html>
