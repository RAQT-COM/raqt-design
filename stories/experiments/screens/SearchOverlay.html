<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #3fe176; }
    a:hover { color: #2bc75e; }
  </style>
<style>html,body{margin:0;padding:0;}</style>
</head>
<body>
<div style="position: relative; width: 402px; height: 874px; overflow: hidden; background: #000000; color: #ffffff; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;">

  <div style="position: absolute; top: 0; left: 0; width: 900px; height: 300px; border-radius: 50%; background: #17601e; filter: blur(70px); transform: translate3d(-270px, 120px, 0) rotate(-13deg);"></div>
  <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: radial-gradient(78% 30% at 10% 9%, #2f2f2f 0%, rgba(0,0,0,0) 76%);"></div>
  <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 48%, rgba(0,0,0,0.45) 70%, rgba(0,0,0,0.9) 86%, #000000 100%);"></div>

  <div style="position: relative; height: 874px; display: flex; flex-direction: column;">

    <div style="flex: none; height: 54px;"></div>

    <div style="flex: none; padding: 0 15px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: #ffffff;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" stroke="#000000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -11px;">
          <svg width="18" height="22" viewBox="0 0 18 22" fill="#ffffff" aria-hidden="true">
            <path d="M9 1.2a6.4 6.4 0 0 0-6.4 6.4v3.7L1 15.1a.9.9 0 0 0 .8 1.3h14.4a.9.9 0 0 0 .8-1.3l-1.6-3.8V7.6A6.4 6.4 0 0 0 9 1.2Z"></path>
            <path d="M6.6 18a2.5 2.5 0 0 0 4.8 0H6.6Z"></path>
          </svg>
          <span style="position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 0 2px #000000;"></span>
        </div>
      </div>

      <h1 style="margin: 18px 0 0; font-family: 'Archivo', sans-serif; font-size: 28px; line-height: 30px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase;">Tournaments</h1>

      <div style="margin-top: 18px; display: flex; align-items: center; gap: 9px; height: 46px; border-radius: 14px; padding: 0 13px; background: rgba(24,24,24,0.62);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="flex: none;" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="7.5" stroke="#8a8a8a" stroke-width="2.2"></circle>
          <line x1="16.2" y1="16.2" x2="21" y2="21" stroke="#8a8a8a" stroke-width="2.2" stroke-linecap="round"></line>
        </svg>
        <span style="font-size: 15px; font-weight: 500; color: #8a8a8a;">Tournament or city</span>
      </div>

      <div style="margin-top: 10px; display: flex; gap: 10px;">
        <div style="display: flex; flex: 1 1 auto; align-items: center; justify-content: space-between; height: 40px; border-radius: 13px; padding: 0 13px; background: rgba(24,24,24,0.62); min-width: 0;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;">All countries</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" style="flex: none; margin-left: 6px;" aria-hidden="true">
            <path d="m6 9 6 6 6-6" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div style="display: flex; flex: none; align-items: center; height: 40px; border-radius: 13px; padding: 3px; background: rgba(24,24,24,0.62);">
          <span style="display: flex; align-items: center; height: 100%; padding: 0 12px; border-radius: 10px; background: #333333; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;">All</span>
          <span style="display: flex; align-items: center; height: 100%; padding: 0 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #8a8a8a;">Open</span>
          <span style="display: flex; align-items: center; height: 100%; padding: 0 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #8a8a8a;">Closed</span>
        </div>
      </div>

      <p style="margin: 20px 0 10px; font-size: 11px; line-height: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8a8a;">6 Tournaments</p>
    </div>

    <div style="flex: 1 1 auto; overflow: hidden; padding: 0 15px;">
      <div style="display: flex; flex-direction: column; gap: 20px;">

        <div style="position: relative; border-radius: 20px; overflow: hidden;">
          <img src="court.png" alt="" style="height: 168px; width: 100%; object-fit: cover; display: block;">
          <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(to top, rgba(0,0,0,0.90) 0%, rgba(0,0,0,0.55) 34%, rgba(0,0,0,0) 66%);"></div>
          <span style="position: absolute; top: 12px; right: 12px; border-radius: 999px; padding: 2px 8px; font-size: 11px; line-height: 14px; font-weight: 700; background: #3fe176; color: #000000;">OPEN</span>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 14px 13px; color: #ffffff;">
            <span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.7);">Sep 22–24, 2023</span>
            <h3 style="margin: 5px 0 0; font-family: 'Archivo', sans-serif; font-size: 18px; line-height: 20px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase;">Stockholm Pickleball Open</h3>
            <div style="margin-top: 7px; display: flex; align-items: center; gap: 5px;">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
                <path d="M6 .8a4 4 0 0 0-4 4c0 3 4 6.4 4 6.4s4-3.4 4-6.4a4 4 0 0 0-4-4Zm0 5.6a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2Z"></path>
              </svg>
              <span style="font-size: 11px; line-height: 14px; font-weight: 500;">Stockholm, Sweden</span>
            </div>
          </div>
        </div>
        <div style="position: relative; border-radius: 20px; overflow: hidden;">
          <img src="feed.png" alt="" style="height: 168px; width: 100%; object-fit: cover; display: block;">
          <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(to top, rgba(0,0,0,0.90) 0%, rgba(0,0,0,0.55) 34%, rgba(0,0,0,0) 66%);"></div>
          <span style="position: absolute; top: 12px; right: 12px; border-radius: 999px; padding: 2px 8px; font-size: 11px; line-height: 14px; font-weight: 700; background: #3fe176; color: #000000;">OPEN</span>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 14px 13px; color: #ffffff;">
            <span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.7);">Oct 6–8, 2023</span>
            <h3 style="margin: 5px 0 0; font-family: 'Archivo', sans-serif; font-size: 18px; line-height: 20px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase;">Göteborg Winter Slam</h3>
            <div style="margin-top: 7px; display: flex; align-items: center; gap: 5px;">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
                <path d="M6 .8a4 4 0 0 0-4 4c0 3 4 6.4 4 6.4s4-3.4 4-6.4a4 4 0 0 0-4-4Zm0 5.6a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2Z"></path>
              </svg>
              <span style="font-size: 11px; line-height: 14px; font-weight: 500;">Göteborg, Sweden</span>
            </div>
          </div>
        </div>
        <div style="position: relative; border-radius: 20px; overflow: hidden;">
          <img src="court.png" alt="" style="height: 168px; width: 100%; object-fit: cover; display: block;">
          <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(to top, rgba(0,0,0,0.90) 0%, rgba(0,0,0,0.55) 34%, rgba(0,0,0,0) 66%);"></div>
          <span style="position: absolute; top: 12px; right: 12px; border-radius: 999px; padding: 2px 8px; font-size: 11px; line-height: 14px; font-weight: 700; background: rgba(0,0,0,0.55); color: #d4d4d4;">CLOSED</span>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 14px 13px; color: #ffffff;">
            <span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.7);">Oct 20–22, 2023</span>
            <h3 style="margin: 5px 0 0; font-family: 'Archivo', sans-serif; font-size: 18px; line-height: 20px; font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase;">Copenhagen Paddle Cup</h3>
            <div style="margin-top: 7px; display: flex; align-items: center; gap: 5px;">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" aria-hidden="true">
                <path d="M6 .8a4 4 0 0 0-4 4c0 3 4 6.4 4 6.4s4-3.4 4-6.4a4 4 0 0 0-4-4Zm0 5.6a1.6 1.6 0 1 1 0-3.2 1.6 1.6 0 0 1 0 3.2Z"></path>
              </svg>
              <span style="font-size: 11px; line-height: 14px; font-weight: 500;">København, Denmark</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <div style="flex: none; position: relative; height: 90px; background: #000000; border-top: 1px solid rgba(255,255,255,0.10);">
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 80px; align-items: center; padding: 0 15px;">
        <div style="display: flex; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="7.5"></circle>
            <line x1="16.2" y1="16.2" x2="21" y2="21"></line>
          </svg>
        </div>
        <div style="display: flex; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21.5s7.5-6.1 7.5-11.5a7.5 7.5 0 0 0-15 0c0 5.4 7.5 11.5 7.5 11.5Z"></path>
            <circle cx="12" cy="10" r="2.9"></circle>
          </svg>
        </div>
        <div style="display: flex; justify-content: center;">
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; width: 52px; height: 52px; border-radius: 17px; background: radial-gradient(120% 120% at 50% 58%, #5ae78e 0%, #35d46c 62%, #2bc75e 100%);">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
              <path d="M13.6 2 4 13.4h6.1L9.4 22 20 10.2h-6.7L13.6 2Z"></path>
            </svg>
            <span style="font-size: 10px; line-height: 11px; font-weight: 800; letter-spacing: 0.02em; color: #ffffff;">PLAY</span>
          </div>
        </div>
        <div style="display: flex; justify-content: center;">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3.8c-4.8 0-8.7 3.3-8.7 7.4 0 2.3 1.2 4.3 3.1 5.6v3.4l3.3-1.8c.7.1 1.5.2 2.3.2 4.8 0 8.7-3.3 8.7-7.4S16.8 3.8 12 3.8Z"></path>
          </svg>
        </div>
        <div style="display: flex; justify-content: center;">
          <img src="nav-me.png" alt="" style="width: 33px; height: 33px; border-radius: 50%;">
        </div>
      </div>
      <span style="position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 999px; background: #ffffff;"></span>
    </div>

  </div>
</div>
</body>
</html>
