<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #3fe176; }
    a:hover { color: #2bc75e; }
  </style>
<style>html,body{margin:0;padding:0;}</style>
</head>
<body>
<div style="position: relative; width: 402px; height: 874px; overflow: hidden; background: #000000; color: #ffffff; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;">

  <div style="position: absolute; top: 0; left: 0; width: 900px; height: 300px; border-radius: 50%; background: #17601e; filter: blur(70px); transform: translate3d(-249px, 260px, 0) rotate(-33deg);"></div>
  <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: radial-gradient(78% 30% at 10% 9%, #2f2f2f 0%, rgba(0,0,0,0) 76%);"></div>
  <div style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 48%, rgba(0,0,0,0.45) 70%, rgba(0,0,0,0.9) 86%, #000000 100%);"></div>

  <div style="position: relative; height: 874px; display: flex; flex-direction: column;">

    <div style="flex: none; height: 54px;"></div>

    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 76px; padding: 0 20px;">
      <img src="logotype.png" alt="RAQT" style="height: 26px; width: auto;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <div style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 999px; background: rgba(40,40,40,0.84);">
          <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true">
            <defs>
              <linearGradient id="sfd-spark" x1="0" y1="0.5" x2="1" y2="0.5">
                <stop offset="0" stop-color="#ecd70f"></stop>
                <stop offset="1" stop-color="#17d172"></stop>
              </linearGradient>
            </defs>
            <path d="M10 0c.5 5.2 4.3 9 9.5 10-5.2 1-9 4.8-9.5 10-.5-5.2-4.3-9-9.5-10C5.7 9 9.5 5.2 10 0Z" fill="url(#sfd-spark)"></path>
          </svg>
          <span style="font-size: 13.5px; font-weight: 700;">1259 points</span>
        </div>
        <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -11px;">
          <svg width="18" height="22" viewBox="0 0 18 22" fill="#ffffff" aria-hidden="true">
            <path d="M9 1.2a6.4 6.4 0 0 0-6.4 6.4v3.7L1 15.1a.9.9 0 0 0 .8 1.3h14.4a.9.9 0 0 0 .8-1.3l-1.6-3.8V7.6A6.4 6.4 0 0 0 9 1.2Z"></path>
            <path d="M6.6 18a2.5 2.5 0 0 0 4.8 0H6.6Z"></path>
          </svg>
          <span style="position: absolute; top: 10px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 0 2px #000000;"></span>
        </div>
      </div>
    </div>

    <div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 0 10px;">

      <div style="display: flex; align-items: center; justify-content: center; height: 157px; border-radius: 20px; background: linear-gradient(162deg, #373f4e 2%, #0f192b 70%);">
        <img src="atp-hero.png" alt="ATP Tour Live" style="width: 58px; height: 58px; border-radius: 50%;">
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <div style="display: flex; flex-direction: column; height: 157px; border-radius: 20px; padding: 16px 13px 13px; background: linear-gradient(147deg, rgba(63,225,118,0.14) 0%, rgba(63,225,118,0.04) 30%, rgba(63,225,118,0) 52%), rgba(40,40,40,0.84);">
          <span style="font-size: 10px; line-height: 12px; font-weight: 600;">Badges</span>
          <h2 style="margin: 8px 0 0; font-family: 'Archivo', sans-serif; font-size: 16px; line-height: 17px; font-weight: 700; letter-spacing: -0.015em;">Unlock Achievements</h2>
          <span style="margin-top: auto; font-size: 16px; line-height: 19px; font-weight: 700; letter-spacing: -0.02em;">17%</span>
          <div style="margin-top: 9px; height: 8px; width: 100%; border-radius: 999px; background: #464646; overflow: hidden;">
            <div style="width: 18%; height: 8px; border-radius: 999px; background: #3fe176;"></div>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; height: 157px; border-radius: 20px; background: #0f192b;">
          <img src="atp-tile.png" alt="ATP Tour Live" style="width: 64px; height: 64px; border-radius: 50%;">
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <div style="display: flex; flex-direction: column; height: 157px; border-radius: 20px; padding: 16px 13px 13px; background: linear-gradient(147deg, rgba(63,225,118,0.14) 0%, rgba(63,225,118,0.04) 30%, rgba(63,225,118,0) 52%), rgba(40,40,40,0.84);">
          <span style="font-size: 10px; line-height: 12px; font-weight: 600;">Clinics</span>
          <h2 style="margin: 8px 0 0; font-family: 'Archivo', sans-serif; font-size: 16px; line-height: 17px; font-weight: 700; letter-spacing: -0.015em;">Livechat with<br>pro coaches</h2>
          <div style="margin-top: auto; display: flex; align-items: center; gap: 11px;">
            <img src="coaches.png" alt="" style="width: 82px; height: 32px;">
            <span style="font-size: 9px; line-height: 11px; font-weight: 500; white-space: nowrap;">+ 12 online now</span>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; height: 157px; border-radius: 20px; overflow: hidden; background: rgba(24,24,24,0.62);">
          <img src="court.png" alt="" style="height: 70px; width: 100%; object-fit: cover;">
          <div style="padding: 12px 7px 0;">
            <div style="display: flex; align-items: center; gap: 4px;">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="#ffffff" aria-hidden="true">
                <path d="M11.4.6 1 4.9c-.6.3-.5 1.1.1 1.3l4 1.3 1.3 4c.2.6 1 .7 1.3.1L11.4.6Z"></path>
              </svg>
              <span style="font-size: 11px; line-height: 13px; font-weight: 500;">5.3 km away from you</span>
            </div>
            <p style="margin: 7px 0 0; font-size: 11px; line-height: 15px; font-weight: 700;">Freddes Pickleballsällskap i Sundyberg &amp; Bromma</p>
          </div>
        </div>
      </div>

      <div style="position: relative; height: 153px; border-radius: 20px; overflow: hidden; background: rgba(40,40,40,0.84);">
        <img src="feed.png" alt="" style="position: absolute; top: 0; left: 0; right: 0; height: 68px; width: 100%; object-fit: cover;">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; height: 88px; padding: 0 25px; border-radius: 20px; background: #333333;">
          <img src="niklas.png" alt="" style="flex: none; width: 42px; height: 42px; border-radius: 50%;">
          <div style="margin-left: 19px; width: 218px; flex: none;">
            <p style="margin: 0; font-size: 16px; line-height: 18px; font-weight: 700; letter-spacing: -0.01em;">Niklas Sidfalk</p>
            <p style="margin: 0; font-size: 16px; line-height: 18px; font-weight: 400;">Det var väldigt kul att spela idag! Ska vi kanske försöka att göra om detta näst...</p>
          </div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-left: auto; flex: none;" aria-hidden="true">
            <path d="m6 9 6 6 6-6" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>

    </div>

    <div style="flex: none; margin-top: auto; position: relative; height: 90px; background: #000000; border-top: 1px solid rgba(255,255,255,0.10);">
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 80px; align-items: center; padding: 0 15px;">
        <div style="display: flex; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="7.5"></circle>
            <line x1="16.2" y1="16.2" x2="21" y2="21"></line>
          </svg>
        </div>
        <div style="display: flex; justify-content: center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21.5s7.5-6.1 7.5-11.5a7.5 7.5 0 0 0-15 0c0 5.4 7.5 11.5 7.5 11.5Z"></path>
            <circle cx="12" cy="10" r="2.9"></circle>
          </svg>
        </div>
        <div style="display: flex; justify-content: center;">
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; width: 52px; height: 52px; border-radius: 17px; background: radial-gradient(120% 120% at 50% 58%, #5ae78e 0%, #35d46c 62%, #2bc75e 100%);">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
              <path d="M13.6 2 4 13.4h6.1L9.4 22 20 10.2h-6.7L13.6 2Z"></path>
            </svg>
            <span style="font-size: 10px; line-height: 11px; font-weight: 800; letter-spacing: 0.02em; color: #ffffff;">PLAY</span>
          </div>
        </div>
        <div style="display: flex; justify-content: center;">
          <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3.8c-4.8 0-8.7 3.3-8.7 7.4 0 2.3 1.2 4.3 3.1 5.6v3.4l3.3-1.8c.7.1 1.5.2 2.3.2 4.8 0 8.7-3.3 8.7-7.4S16.8 3.8 12 3.8Z"></path>
          </svg>
        </div>
        <div style="display: flex; justify-content: center;">
          <img src="nav-me.png" alt="" style="width: 33px; height: 33px; border-radius: 50%;">
        </div>
      </div>
      <span style="position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 999px; background: #ffffff;"></span>
    </div>

  </div>
</div>
</body>
</html>
