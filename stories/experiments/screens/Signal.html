<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=402, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; }
    a { color: #00a650; }
    a:hover { color: #101010; }
  </style>
<style>html,body{margin:0;padding:0;}</style>
</head>
<body>
<div style="width: 402px; height: 874px; overflow: hidden; background: #f6f6f2; color: #101010; font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column;">

  <div style="flex: none; height: 54px;"></div>

  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; border-bottom: 2px solid #101010;">
    <img src="logotype.png" alt="RAQT" style="height: 20px; width: auto; filter: invert(1);">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.02em;">1259</span>
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #6d6d66;">pts</span>
      </div>
      <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#101010" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
        </svg>
        <span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; background: #f5a300;"></span>
      </div>
    </div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 0; min-height: 0;">

    <div style="flex: none; display: flex; align-items: center; justify-content: center; height: 132px; background: #ffffff; border: 2px solid #101010;">
      <img src="atp-tile.png" alt="ATP Tour Live" style="width: 58px; height: 58px; border-radius: 50%;">
    </div>

    <div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">

      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 158px; background: #ffffff; border: 2px solid #101010; padding: 13px;">
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6d6d66;">Badges</span>
          <span style="font-size: 17px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em;">Unlock Achievements</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em;">17%</span>
          <div style="height: 10px; border: 2px solid #101010; background: #ffffff;">
            <div style="width: 17%; height: 6px; background: #00a650;"></div>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 158px; background: #ffffff; border: 2px solid #101010; padding: 13px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6d6d66;">Today</span>
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: #00a650;">2 OF 4</span>
        </div>
        <div style="position: relative; width: 152px; height: 70px; align-self: center;">
          <svg width="152" height="70" viewBox="0 0 152 70" style="position: absolute; top: 0; left: 0;" aria-hidden="true">
            <rect x="1" y="1" width="150" height="68" fill="#ffffff" stroke="#101010" stroke-width="2"></rect>
            <line x1="76" y1="1" x2="76" y2="69" stroke="#101010" stroke-width="2"></line>
            <g stroke="#c9c9c0" stroke-width="1.5">
              <line x1="62" y1="1" x2="62" y2="69"></line>
              <line x1="90" y1="1" x2="90" y2="69"></line>
              <line x1="1" y1="35" x2="62" y2="35"></line>
              <line x1="90" y1="35" x2="151" y2="35"></line>
            </g>
          </svg>
          <span style="position: absolute; left: 31px; top: 18px; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%; background: #00a650;"></span>
          <span style="position: absolute; left: 121px; top: 18px; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%; background: #00a650;"></span>
          <span style="position: absolute; left: 31px; top: 52px; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%; background: #ffffff; border: 2px solid #101010;"></span>
          <span style="position: absolute; left: 121px; top: 52px; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%; background: #ffffff; border: 2px solid #101010;"></span>
        </div>
        <span style="font-size: 13px; font-weight: 500;">14:00 · Freddes</span>
      </div>

    </div>

    <div style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">

      <div style="display: flex; flex-direction: column; justify-content: space-between; height: 158px; background: #ffffff; border: 2px solid #101010; padding: 13px;">
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6d6d66;">Clinics</span>
          <span style="font-size: 17px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em;">Livechat with pro coaches</span>
        </div>
        <div style="display: flex; align-items: center; gap: 9px;">
          <img src="coaches.png" alt="" style="flex: none; width: 70px; height: 27px;">
          <span style="font-size: 11px; font-weight: 500; color: #6d6d66;">12 online</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; height: 158px; background: #ffffff; border: 2px solid #101010;">
        <img src="court.png" alt="" style="width: 100%; height: 72px; object-fit: cover; display: block; border-bottom: 2px solid #101010;">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 11px 12px;">
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6d6d66;">5,3 km</span>
          <span style="font-size: 13px; font-weight: 600; line-height: 1.16; letter-spacing: -0.01em;">Freddes Pickleballsällskap i Sundbyberg</span>
        </div>
      </div>

    </div>

    <div style="flex: none; display: flex; flex-direction: column; background: #ffffff; border: 2px solid #101010;">
      <img src="feed.png" alt="" style="width: 100%; height: 45px; object-fit: cover; display: block; border-bottom: 2px solid #101010;">
      <div style="display: flex; align-items: center; gap: 11px; padding: 11px 12px;">
        <img src="niklas.png" alt="" style="flex: none; width: 34px; height: 34px; border-radius: 50%;">
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6d6d66;">Niklas Sidfalk</span>
          <span style="font-size: 14px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Det var väldigt kul att spela idag!</span>
        </div>
      </div>
    </div>

  </div>

  <div style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 86px; align-items: stretch; padding: 0 16px 16px; border-top: 2px solid #101010;">
    <div style="display: flex; align-items: center; justify-content: center;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#101010" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="7.5"></circle>
        <line x1="16.2" y1="16.2" x2="21" y2="21"></line>
      </svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#a8a89f" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21.5s7.5-6.1 7.5-11.5a7.5 7.5 0 0 0-15 0c0 5.4 7.5 11.5 7.5 11.5Z"></path>
        <circle cx="12" cy="10" r="2.9"></circle>
      </svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 50px; height: 50px; background: #00a650;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
          <path d="M13.6 2 4 13.4h6.1L9.4 22 20 10.2h-6.7L13.6 2Z"></path>
        </svg>
        <span style="font-size: 9px; font-weight: 600; letter-spacing: 0.10em; color: #ffffff;">PLAY</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a8a89f" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3.8c-4.8 0-8.7 3.3-8.7 7.4 0 2.3 1.2 4.3 3.1 5.6v3.4l3.3-1.8c.7.1 1.5.2 2.3.2 4.8 0 8.7-3.3 8.7-7.4S16.8 3.8 12 3.8Z"></path>
      </svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <img src="nav-me.png" alt="" style="width: 30px; height: 30px; border-radius: 50%;">
    </div>
  </div>

</div>
</body>
</html>
