<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; }
    a { color: #3fe176; }
    a:hover { color: #2bc75e; }
  </style>
</helmet>
<div style="width: 402px; height: 874px; overflow: hidden; background: #0a0d0a; color: #ffffff; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column;">

  <div style="flex: none; height: 54px;"></div>

  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 20px;">
    <img src="logotype.png" alt="RAQT" style="height: 21px; width: auto;">
    <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-right: -11px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

        <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
      </svg>
    </div>
  </div>

  <div style="flex: none; position: relative; height: 262px; background: #3fe176; overflow: hidden;">
    <svg width="402" height="262" viewBox="0 0 402 262" style="position: absolute; top: 0; left: 0;" aria-hidden="true">
      <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.38">
        <rect x="28" y="22" width="346" height="218"></rect>
        <line x1="28" y1="131" x2="374" y2="131"></line>
        <line x1="28" y1="100" x2="374" y2="100"></line>

    <div style="position: absolute; left: 22px; right: 22px; bottom: 20px; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-family: 'Anton', 'Arial Narrow', Impact, sans-serif; font-size: 88px; line-height: 0.78; letter-spacing: -0.015em; color: #0a0d0a;">PLAY</div>
      <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; color: #0a0d0a;">Freddes Pickleballsällskap · 5.3 km</div>
    </div>
  </div>

  <div style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid #23291f;">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 18px 0 18px 20px; border-right: 1px solid #23291f;">
      <div style="font-family: 'Anton', 'Arial Narrow', Impact, sans-serif; font-size: 30px; line-height: 1;">1259</div>
      <div style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #7c8479;">Points</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 18px 0 18px 18px; border-right: 1px solid #23291f;">
      <div style="font-family: 'Anton', 'Arial Narrow', Impact, sans-serif; font-size: 30px; line-height: 1; color: #3fe176;">17%</div>
      <div style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #7c8479;">Badges</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 18px 0 18px 18px;">
      <div style="font-family: 'Anton', 'Arial Narrow', Impact, sans-serif; font-size: 30px; line-height: 1;">12</div>
      <div style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #7c8479;">Coaches on</div>
    </div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0;">
    <div style="flex: none; display: flex; gap: 14px; padding: 20px; border-bottom: 1px solid #23291f;">
      <img src="court.png" alt="" style="width: 118px; height: 92px; object-fit: cover; flex: none;">
      <div style="display: flex; flex-direction: column; gap: 7px; min-width: 0;">
        <div style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #3fe176;">Next up · Sat 14:00</div>
        <div style="font-family: 'Anton', 'Arial Narrow', Impact, sans-serif; font-size: 21px; line-height: 1.04; text-transform: uppercase;">Freddes Pickleballsällskap</div>
        <div style="font-size: 12px; color: #7c8479;">Sundbyberg &amp; Bromma</div>
      </div>
    </div>

    <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 18px 20px;">
      <img src="niklas.png" alt="" style="width: 44px; height: 44px; border-radius: 50%; flex: none;">
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <div style="font-size: 13px; font-weight: 700;">Niklas Sidfalk</div>
        <div style="font-size: 13px; color: #7c8479; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Det var väldigt kul att spela idag!</div>
      </div>
    </div>
  </div>

  <div style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid #3fe176; height: 90px; align-items: stretch; padding-bottom: 16px;">
    <div style="display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="7.5"></circle>
        <line x1="16.2" y1="16.2" x2="21" y2="21"></line>
      </svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7c8479" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21.5s7.5-6.1 7.5-11.5a7.5 7.5 0 0 0-15 0c0 5.4 7.5 11.5 7.5 11.5Z"></path>
        <circle cx="12" cy="10" r="2.8"></circle>
      </svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7c8479" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3.8c-4.8 0-8.7 3.3-8.7 7.4 0 2.3 1.2 4.3 3.1 5.6v3.4l3.3-1.8c.7.1 1.5.2 2.3.2 4.8 0 8.7-3.3 8.7-7.4S16.8 3.8 12 3.8Z"></path>
      </svg>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
      <img src="nav-me.png" alt="" style="width: 28px; height: 28px; border-radius: 50%;">
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
